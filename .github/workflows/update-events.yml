name: Update club events

# Refreshes events.json from the club's public RSS feed. This never touches
# programme data or the app itself — only that one file.
#
# Pushes as jfairhead (via the RELEASE_TOKEN secret), not as the default
# github-actions[bot] identity, because this repo's ruleset bypass list has
# no entry for GitHub Actions itself — only for roles, teams and installed
# Apps. Authenticating as a maintainers-team member sidesteps that: the push
# is allowed for the same reason any of your own pushes are. RELEASE_TOKEN
# is a fine-grained PAT scoped to only this repo, Contents: Read and write —
# see README.md ("Club Events") for the full setup.

on:
  schedule:
    - cron: "17 6 * * *"   # once a day; odd minute so it's not stuck at the top of everyone's cron
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fetch and convert the events feed
        run: python3 scripts/update-events.py

      - name: Check whether the actual events data changed (ignoring the timestamp)
        id: check
        run: |
          # events.json always carries a fresh "generated" timestamp, so a
          # plain file diff would say "changed" on every single run, even
          # when every event in it is identical — defeating the point of
          # skipping no-op commits. Compare with that one field stripped
          # out instead, in both the new file and whatever's already
          # committed (if anything — there's nothing yet on a first run).
          python3 - <<'PYEOF_INNER'
          import json, os, subprocess
          new = json.load(open("events.json")); new.pop("generated", None)
          try:
              old_raw = subprocess.run(["git", "show", "HEAD:events.json"], capture_output=True, text=True, check=True).stdout
              old = json.loads(old_raw); old.pop("generated", None)
          except Exception:
              old = None
          changed = old != new
          print("Data change detected:", changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          PYEOF_INNER

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "jfairhead"
          git config user.email "17782781+jfairhead@users.noreply.github.com"
          git add events.json
          git commit -m "Update club events (automated)"
          git push
