name: Update club events

# Refreshes events.json from the club's public RSS feed. This never touches
# programme data or the app itself — only that one file.
#
# Fetching this feed directly from a visitor's browser is blocked by the
# club's site (no CORS headers), so this Action fetches it server-side
# instead, on a schedule, and pushes straight to main if the content
# changed — no PR, no waiting on a human, every day.
#
# That direct push only works because of one specific, deliberate exception
# to "every change needs a pull request":
#   Repo -> Settings -> Rules -> Rulesets -> (the ruleset covering main)
#   -> Bypass list -> add "GitHub Actions" / "Repository admin" as appropriate
#     for how your ruleset UI presents it.
# This exempts pushes made by this workflow (and anything else run by
# GitHub Actions) from the PR requirement. It does NOT exempt changes to the
# workflow file itself from that same requirement — .github/workflows/*.yml
# still needs a token with the "workflow" permission to push, and still goes
# through review like everything else. See README.md ("Club Events") for
# the full reasoning.

on:
  schedule:
    - cron: "17 6 * * *"   # once a day; odd minute so it's not stuck at the top of everyone's cron
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert the events feed
        run: python3 scripts/update-events.py

      - name: Commit and push if events.json changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No change to events.json — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update club events (automated)"
          git push
