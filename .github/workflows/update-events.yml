name: Update club events

# Refreshes events.json from the club's public RSS feed. This never touches
# programme data or the app itself — only that one file.
#
# Runs client-side fetching of this feed is blocked by the club's site (no
# CORS headers), so this Action fetches it server-side instead, on a
# schedule, and opens a pull request when the content has actually changed.
# See README.md ("Club Events") for how this fits together.

on:
  schedule:
    - cron: "17 6 * * *"   # once a day; odd minute so it's not stuck at the top of everyone's cron
  workflow_dispatch: {}    # lets you trigger it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert the events feed
        run: python3 scripts/update-events.py

      - name: Open a PR if events.json changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update club events (automated)"
          title: "Update club events"
          body: |
            Automated refresh of `events.json` from the club's public events feed:
            https://blackwatersailingclub.org.uk/events

            This only changes that one file. Merging republishes the site within a
            couple of minutes, same as any other change to `main`.
          branch: auto/update-events
          delete-branch: true
          add-paths: events.json
