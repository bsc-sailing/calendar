# Turns an approved "Add an extra date" issue into a pull request that adds a
# row to extras-YEAR.csv. Nothing reaches the app until a maintainer approves
# and merges that PR. See README, "Extra dates".
name: Extra date request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write        # push the request's branch (never main)
  pull-requests: write   # open the PR
  issues: write          # comment back on the issue

concurrency:
  group: extra-date-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    # Open issues made with the "Add an extra date" form, recognised by the
    # form's own question headings in the body, not the title (people retype
    # titles). A "labeled" event only matters when the label is "approved",
    # and an edit only when the body changed (this workflow tidies the title
    # itself, which mustn't start another run).
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '### Date') &&
      contains(github.event.issue.body, '### Start time') &&
      contains(github.event.issue.body, '### Where') &&
      (github.event.action != 'labeled' || github.event.label.name == 'approved') &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      # Who may skip the queue: anyone with write access to this repo (checked
      # with GitHub directly; org membership as shown on an issue can't be
      # relied on, since private members show up as outsiders). Anyone else
      # waits for a maintainer to add the "approved" label.
      - name: Check the request is approved
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
          APPROVED: ${{ contains(github.event.issue.labels.*.name, 'approved') }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)"
          echo "Requested by $AUTHOR, who has '$perm' access. Approved label: $APPROVED."
          if [ "$APPROVED" = "true" ] || [ "$perm" = "admin" ] || [ "$perm" = "maintain" ] || [ "$perm" = "write" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for a maintainer to add the 'approved' label." >> "$GITHUB_STEP_SUMMARY"
            if [ "$ACTION" = "opened" ]; then
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Thanks for the request. A club maintainer will check it and add the \`approved\` label, and it will then be added automatically."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      # The issue text is untrusted input: it's read from the event file by the
      # script, never pasted into a shell command here.
      - name: Add the row
        id: add
        if: steps.gate.outputs.go == 'true'
        run: python3 scripts/add-extra-date.py --event "$GITHUB_EVENT_PATH" --repo-root .

      - name: Explain what needs fixing
        if: steps.gate.outputs.go == 'true' && steps.add.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body-file add-extra-date-message.md

      - name: Open or update the pull request
        if: steps.add.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BRANCH="extra-date/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- extras-*.csv
          git commit -m "Add extra date from #$ISSUE"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Add extra date from #$ISSUE" \
              --body-file add-extra-date-pr.md
            gh issue comment "$ISSUE" --body "Thanks. A pull request has been opened for a maintainer to review, and this will appear in the app once it's merged. Editing this issue updates the request."
          fi

      # Give the issue a consistent, readable title, e.g. "Extra date: 2026-10-16 Blindfold Racing".
      # Only the title changes, so this doesn't start another run (see "if" above).
      - name: Tidy the issue title
        if: steps.add.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CURRENT: ${{ github.event.issue.title }}
        run: |
          NEW="$(cat add-extra-date-title.txt)"
          if [ -n "$NEW" ] && [ "$NEW" != "$CURRENT" ]; then gh issue edit "$ISSUE" --title "$NEW"; fi
